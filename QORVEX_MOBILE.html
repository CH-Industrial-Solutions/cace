<style>
:root{
  --navy-900:#071528;--navy-800:#0b1f3a;--navy-700:#12305a;
  --blue:#1565c0;--blue-bright:#1e88e5;--teal:#00a8b0;--teal-bright:#00c2c7;
  --bg:#eef2f7;--panel:#fff;--line:#d8e0ea;--text:#13233a;--muted:#5f6f84;
  --ok:#1b9e5a;--ok-bg:#e5f6ed;--err:#d32f2f;--err-bg:#fdecec;--warn:#ef8a00;--warn-bg:#fff4e0;
  --radius:10px;--shadow:0 1px 2px rgba(7,21,40,.06),0 4px 14px rgba(7,21,40,.06);
  font-family:"Segoe UI","Segoe UI Variable",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-size:15px}
button,input,select{font:inherit}
a{color:var(--blue)}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.spacer{flex:1}

/* ---------- Shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:6px 14px;min-height:54px;flex-wrap:wrap;
  background:linear-gradient(90deg,var(--navy-900),var(--navy-800) 60%,var(--navy-700));color:#fff;border-bottom:3px solid var(--teal);position:sticky;top:0;z-index:20}
.brand-name{font-weight:800;letter-spacing:.08em;font-size:14px;line-height:1.15}
.brand-name small{display:block;font-weight:500;letter-spacing:.08em;font-size:10px;color:var(--teal-bright)}
.chip{display:flex;flex-direction:column;padding:4px 12px;border-left:1px solid rgba(255,255,255,.15);line-height:1.2;background:none;border-top:0;border-right:0;border-bottom:0;color:#fff;text-align:left}
.chip .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9fb4cf}
.chip .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9fb4cf}
.login-page{background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-800) 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(7,21,40,.3);padding:40px;width:100%;max-width:420px}
.login-card h2{margin:0 0 8px;font-size:28px;font-weight:800;color:var(--navy-800)}
.login-card .muted{display:block;margin-bottom:24px;font-size:14px}
.login-card form{display:flex;flex-direction:column}
.login-card .field{margin-bottom:16px}
.login-card .input{height:44px;font-size:15px}
.login-card .btn{margin-top:12px}
.login-hero{text-align:center;margin-bottom:40px;color:#fff}
.brand-logos{font-size:18px;font-weight:800;letter-spacing:.1em}
.chip .v{font-weight:600;font-size:14px;white-space:nowrap}
button.chip{cursor:pointer;border-radius:6px}
button.chip:hover{background:rgba(255,255,255,.08)}
.btn-logout{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn-logout:hover{background:rgba(255,255,255,.1)}
.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;position:sticky;top:54px;z-index:19}
.tab{background:none;border:none;padding:11px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--navy-800);border-bottom-color:var(--teal)}
.tab.adm{color:#7a5a00}
.tab.adm.on{color:var(--navy-800)}
.tab-sep{width:1px;background:var(--line);margin:10px 6px}
.main{flex:1;padding:12px 14px 20px;max-width:1400px;width:100%;margin:0 auto}
.page-title{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.page-title h1{font-size:22px;margin:0;font-weight:700}
.page-title .sub{color:var(--muted);font-size:13px}
.page-title .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Panels & forms ---------- */
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;border:1px solid var(--line);margin-bottom:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px;font-weight:700}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.input,select.input{width:100%;min-width:0;height:38px;padding:0 11px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s,background .15s;font-size:14px}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,168,176,.22)}
.input.big{height:42px;font-size:17px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.input.scan{text-transform:uppercase;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.field.invalid .input{border-color:var(--err);background:var(--err-bg)}
.field.good .input{border-color:#8fd3ae;background:#f3fbf6}
.field.warnf .input{border-color:#ffc56b;background:var(--warn-bg)}
.field .msg{font-size:12.5px;color:var(--err);font-weight:600;min-height:0}
.field .msg.warn{color:#b86500}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal)}

.btn{height:36px;padding:0 14px;border-radius:6px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--blue-bright)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-bright)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:#f1b9b9}
.btn.danger:hover{border-color:var(--err);background:var(--err-bg)}
.btn.danger-solid{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.xl{height:44px;font-size:15px;padding:0 22px;letter-spacing:.05em}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{position:sticky;top:0;background:#f2f6fb;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.t td{padding:6px 10px;border-bottom:1px solid #edf1f6;vertical-align:middle}
.t tr:hover td{background:#f8fbff}
.t tr.deleted td{color:#8a97a8;background:#fafbfc}
.t .mono{font-family:Consolas,"Courier New",monospace;font-weight:700;letter-spacing:.02em}
.badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-err{background:var(--err-bg);color:var(--err)}
.b-warn{background:var(--warn-bg);color:#b86500}
.b-info{background:#e3f2fd;color:var(--blue)}
.b-mute{background:#eef1f5;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.toolbar .field{flex:0 1 auto}
.toolbar .input{height:38px}
.toolbar .search{flex:1 1 240px}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px}
.diff-b{color:var(--err);text-decoration:line-through;font-family:Consolas,monospace;font-weight:700}
.diff-a{color:var(--ok);font-family:Consolas,monospace;font-weight:700}

/* ---------- KPIs ---------- */
.kpi{background:var(--panel);border-radius:var(--radius);padding:10px 14px;border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--navy-800)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.blue::before{background:var(--blue)}
.kpi.warn::before{background:var(--warn)}
.kpi.err::before{background:var(--err)}
.comp-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cchip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--text)}
.cchip b{margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.cchip.on{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.cchip.on b{color:var(--teal-bright)}
.mode-btn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px 12px;cursor:pointer;text-align:center;color:var(--text);transition:all .15s}
.mode-btn:hover{border-color:var(--teal);background:#f0fafb}
.mode-btn.sel{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.mode-btn.sel .mb-icon{color:var(--teal-bright)}
.mb-icon{font-size:28px;margin-bottom:6px;display:block}
.mb-title{font-weight:700;font-size:15px;margin-bottom:3px}
.mb-desc{font-size:12px;color:var(--muted)}
.mode-btn.sel .mb-desc{color:#9fb4cf}

/* ---------- Captura ---------- */
.comp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.comp-tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left;color:var(--text);min-height:65px;font-size:13px}
.comp-tile b{font-size:15px;letter-spacing:.01em;font-weight:700}
.comp-tile small{color:var(--muted);font-size:11px;line-height:1.3}
.comp-tile:hover{border-color:var(--teal)}
.comp-tile.sel{border-color:var(--teal);background:#e9fbfb;box-shadow:inset 0 0 0 1px var(--teal)}
.comp-tile.sel b{color:var(--navy-800)}
.cap-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--navy-800);color:#fff;border-radius:var(--radius);padding:8px 10px;margin-bottom:10px;font-size:13px}
.cap-head .ci{display:flex;flex-direction:column;padding:0 10px;border-left:1px solid rgba(255,255,255,.15);line-height:1.15}
.cap-head .ci:first-child{border-left:0;padding-left:4px}
.cap-head .ci .k{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#9fb4cf}
.cap-head .ci .v{font-size:14px;font-weight:800;letter-spacing:.02em}
.cap-head .ci .v.t{color:var(--teal-bright)}
.job-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.job-grid .field label{font-size:10px}
.job-grid .input{height:36px;font-size:13px}
.jobs-head{display:flex;align-items:baseline;gap:12px;margin:12px 0 8px;flex-wrap:wrap}
.jobs-head h2{margin:0}
.counter{font-size:13px;font-weight:800;color:var(--navy-800);background:#e6fafa;border:1px solid #9fe2e4;border-radius:99px;padding:3px 10px}
.cap-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.flash{background:var(--ok);color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;display:flex;gap:12px;align-items:center;margin-bottom:14px;animation:tin .2s ease-out}
.flash svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.5;flex:none}
.cl-table td{padding:3px 6px}
.cl-table .input{height:36px;font-size:15px}
.cl-table td.n{width:36px;font-size:13px;text-align:center;font-weight:800;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);color:#8a4b00;border:1px solid #ffd38a}
.banner.err{background:var(--err-bg);color:#9b1c1c;border:1px solid #f3b4b4}
.banner.ok{background:var(--ok-bg);color:#13643c;border:1px solid #9fdcb8}
.banner.info{background:#e3f2fd;color:#0d47a1;border:1px solid #b3d4f5}
.meter{height:14px;background:#edf2f8;border-radius:99px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal-bright));border-radius:99px}
.meter.hot i{background:linear-gradient(90deg,var(--warn),var(--err))}

/* ---------- Login ---------- */
.login-page{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-hero{background:radial-gradient(1200px 600px at 10% 10%,#12305a,var(--navy-900));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.login-hero::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border:40px solid rgba(0,194,199,.12);border-radius:50%}
.login-hero h1{font-size:42px;letter-spacing:.1em;margin:0;font-weight:800;line-height:1.1}
.login-hero h1 span{color:var(--teal-bright)}
.login-hero p{color:#9fb4cf;max-width:440px;line-height:1.5}
.brand-logos{font-weight:700;font-size:13px;letter-spacing:.08em;opacity:.85}
.login-clock{font-size:13px;color:#9fb4cf;position:relative;z-index:1}
.login-card{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.login-card form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login-card h2{margin:0;font-size:24px}
.login-card .input{height:56px;font-size:19px}
.form-error{background:var(--err-bg);color:var(--err);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}
.login-dev{display:flex;align-items:center;gap:10px;font-size:12px;color:#8ea3bf;position:relative;z-index:1}
.login-dev img{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain}
.login-dev b{color:#cfe0f5;font-weight:600}

/* ---------- Modal & toasts ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(7,21,40,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(900px,100%)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:18px;flex:1}
.modal header .x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.modal .body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.modal.danger header{background:var(--err);color:#fff;border-radius:12px 12px 0 0}
.modal.danger header .x{color:#fff}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;text-align:left;color:var(--text);width:100%}
.opt:hover{border-color:var(--teal);background:#f5fdfd}
.opt b{flex:1}
.opt .n{color:var(--muted);font-variant-numeric:tabular-nums}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{min-width:260px;max-width:420px;padding:14px 16px;border-radius:10px;color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}.toast.warn{background:var(--warn)}.toast.info{background:var(--navy-700)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* ---------- Bienvenida (estilo corporativo) ---------- */
.welcome{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(180deg,var(--navy-900),var(--navy-800));color:#fff;animation:wIn .3s ease-out;padding:24px}
.welcome::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--teal)}
.welcome.out{animation:wOut .3s ease-in forwards}
.w-card{width:min(680px,100%);border-left:3px solid var(--teal);padding:6px 0 6px 28px}
.w-brand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6f86a6;font-weight:600;animation:wUp .4s ease-out both}
.w-hi{margin-top:26px;font-size:22px;color:#9fb4cf;font-weight:400;animation:wUp .4s ease-out .08s both}
.w-nm{font-size:clamp(34px,5.5vw,48px);font-weight:600;letter-spacing:.01em;line-height:1.15;margin-top:4px;animation:wUp .4s ease-out .14s both}
.w-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);animation:wUp .4s ease-out .22s both}
.w-meta .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6f86a6;font-weight:600}
.w-meta .v{font-size:15px;font-weight:600;margin-top:4px;color:#e6eef8}
.w-load{margin-top:30px;height:2px;background:rgba(255,255,255,.08);overflow:hidden;animation:wUp .4s ease-out .28s both}
.w-load i{display:block;height:100%;background:var(--teal-bright);transform-origin:left;animation:wBar 1.7s cubic-bezier(.4,0,.2,1) .2s both}
.w-foot{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:space-between;padding:0 28px;font-size:12px;color:#6f86a6;letter-spacing:.04em}
@keyframes wIn{from{opacity:0}}
@keyframes wOut{to{opacity:0}}
@keyframes wUp{from{transform:translateY(8px);opacity:0}}
/* Mejoras de diseño login elegante */
.login-card form .field:last-child{margin-bottom:12px}
.login-card .muted a{color:var(--blue);text-decoration:none}
.login-card .form-error{background:var(--err-bg);color:var(--err);padding:12px;border-radius:8px;font-size:13px;margin:8px 0}

/* Compact table rows */
.t th{padding:8px 10px}
.t .cl-table td{padding:2px 6px}
.t .cl-table .input{height:34px;font-size:14px}

/* Mode button improvements */

.mode-btn.sel .mb-icon{background:rgba(0,194,199,.2);color:var(--teal-bright)}

@keyframes wBar{from{transform:scaleX(0)}}
@media (max-width:560px){.w-meta{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.welcome *,.welcome{animation-duration:.01s!important;animation-delay:0s!important}}
/* ---------- Footer ---------- */
.app-foot{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;color:var(--muted);font-size:12px}
.app-foot img{width:26px;height:26px;border-radius:6px;object-fit:contain;background:#fff}

/* =====================================================================
   INICIO (tonos turquesa, tarjeta al centro) + acabado sereno general
   ===================================================================== */
:root{--sea-900:#0c2f3d;--sea-700:#14586a;--sea-500:#2a8f9c;--sea-300:#6cc6cb;--sea-100:#cdeced;--ink:#123049}
.login-page{position:relative;min-height:100vh;display:flex !important;align-items:center;justify-content:center;padding:90px 20px;overflow:hidden;
  background:radial-gradient(900px 600px at 15% 20%,#8fd6d8 0%,transparent 60%),radial-gradient(800px 600px at 85% 80%,#1f7f8c 0%,transparent 60%),linear-gradient(135deg,#3aa3ad 0%,#2a8794 45%,#175f6e 100%)}
.lp-glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.lp-glow.g1{width:420px;height:420px;left:-80px;top:-60px;background:#b4ecec;animation:lpF 14s ease-in-out infinite alternate}
.lp-glow.g2{width:520px;height:520px;right:-140px;bottom:-160px;background:#0f4f5f;animation:lpF 18s ease-in-out infinite alternate-reverse}
.lp-glow.g3{width:300px;height:300px;right:22%;top:12%;background:#7fd0d3;opacity:.35;animation:lpF 16s ease-in-out infinite alternate}
@keyframes lpF{to{transform:translate(40px,30px) scale(1.08)}}
.login-hero{position:absolute;inset:0;padding:26px 32px;display:flex !important;flex-direction:column;justify-content:space-between;background:none !important;color:#fff;pointer-events:none;z-index:1;margin:0}
.login-hero::after{display:none}
.login-hero .login-dev,.login-hero a{pointer-events:auto}
.lh-brand{font-weight:800;letter-spacing:.14em;font-size:15px;color:#fff;text-shadow:0 1px 8px rgba(8,40,52,.25)}
.lh-brand span{display:block;font-weight:600;font-size:10.5px;letter-spacing:.16em;color:#dff6f6;margin-top:3px}
.lh-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.login-clock{color:#e6f7f7 !important;font-size:12.5px;text-transform:capitalize}
.login-dev{color:#d8f1f2 !important;font-size:12px}
.login-dev b{color:#fff !important}
.login-dev img{width:28px;height:28px;border-radius:7px}
.login-card{position:relative;z-index:2;display:block !important;width:100%;max-width:390px;padding:34px 34px 26px !important;border-radius:22px !important;
  background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.12)) !important;border:1px solid rgba(255,255,255,.45);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 30px 70px rgba(6,40,52,.35),inset 0 1px 0 rgba(255,255,255,.5);animation:lcIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes lcIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.login-card form{max-width:none !important;gap:14px !important}
.l-avatar{width:86px;height:86px;border-radius:50%;margin:-4px auto 2px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 26px rgba(6,40,52,.25)}
.l-avatar svg{width:52px;height:52px;fill:#2d5a6c;opacity:.85}
.l-head{text-align:center}
.login-card h2{color:#fff !important;font-size:24px !important;font-weight:700 !important;letter-spacing:.02em;margin:0 !important;text-shadow:0 1px 10px rgba(6,40,52,.25)}
.login-card .muted{color:#e3f5f6 !important;margin:4px 0 0 !important;font-size:13px !important}
.login-card .field{margin:0 !important;position:relative}
.login-card .field>label{color:#e9f8f8;font-size:11px;letter-spacing:.08em}
.login-card .field.ic>label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.login-card .input{height:46px !important;font-size:15.5px !important;background:rgba(255,255,255,.12) !important;color:#fff !important;
  border:0 !important;border-bottom:1.5px solid rgba(255,255,255,.75) !important;border-radius:8px 8px 0 0 !important;box-shadow:none !important;text-transform:none}
.login-card .field.ic .input{padding-left:42px}
.login-card .input::placeholder{color:rgba(240,252,252,.82)}
.login-card .input:focus{background:rgba(255,255,255,.22) !important;border-bottom-color:#fff !important}
.login-card .field.ic svg{position:absolute;left:12px;top:13px;width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;opacity:.9;pointer-events:none}
.login-card .field .msg{color:#ffe0e0;text-shadow:0 1px 4px rgba(80,0,0,.3)}
.login-card .btn.primary{margin-top:6px !important;height:48px;border-radius:8px;border:0;letter-spacing:.14em;font-weight:700;
  background:linear-gradient(180deg,#173c5e,#0e2a45) !important;color:#fff;box-shadow:0 10px 24px rgba(8,30,50,.35);transition:transform .12s,box-shadow .2s}
.login-card .btn.primary:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(8,30,50,.4)}
.login-card .btn.primary:active{transform:translateY(0)}
.l-help{text-align:center;font-size:12px !important;opacity:.9}
.login-card a{color:#fff !important;text-decoration:underline}
.login-card .form-error{background:rgba(160,20,30,.35) !important;color:#fff !important;border:1px solid rgba(255,190,190,.5)}
.login-card.ok{animation:lcOk .45s ease-out both}
@keyframes lcOk{40%{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 60px 20px rgba(190,250,250,.8)}100%{opacity:.0;transform:scale(1.03)}}
.l-flash{position:fixed;inset:0;z-index:90;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95) 0%,rgba(200,250,250,.6) 25%,rgba(255,255,255,0) 60%);animation:lFl .85s ease-out forwards}
@keyframes lFl{0%{opacity:0;transform:scale(.6)}25%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
@media (max-width:560px){.login-hero{padding:16px 18px}.lh-bot{justify-content:center;text-align:center}.login-card{padding:28px 22px 22px !important}}
@media (prefers-reduced-motion:reduce){.lp-glow,.login-card,.l-flash{animation:none !important}}

/* =====================================================================
   QORVEX MOBILE — identidad compartida con QORVEX (azul oscuro + cian
   neón). Solo apariencia: no cambia funciones ni datos.
   ===================================================================== */
:root{
  --q-bg:#050B18;--q-panel:#0B1730;--q-panel2:#0F1F3F;--q-input:#08132A;
  --q-line:#1D3157;--q-line2:#27416F;--q-neon:#00E5FF;--q-cyan:#22D3EE;--q-cyan2:#5BE7FF;--q-blue:#1E6BFF;
  --q-ink:#E6F0FF;--q-title:#F4F8FF;--q-muted:#8EA3C2;--q-dim:#5F7699;
  --bg:#050B18;--panel:#0B1730;--line:#1D3157;--text:#E6F0FF;--muted:#8EA3C2;
  --navy-800:#F4F8FF;--teal:#22D3EE;--teal-bright:#00E5FF;--blue:#22D3EE;--blue-bright:#5BE7FF;
  --ok:#34D399;--ok-bg:rgba(52,211,153,.14);--err:#FF6B6B;--err-bg:rgba(239,68,68,.16);--warn:#FBBF5A;--warn-bg:rgba(251,191,90,.14);
  --shadow:0 10px 30px rgba(0,0,0,.28);
  color-scheme:dark;
}
html,body{background:radial-gradient(1200px 700px at 85% -10%,rgba(30,107,255,.18),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(34,211,238,.10),transparent 60%),#050B18 fixed !important;color:var(--q-ink)}
::selection{background:rgba(34,211,238,.35)}
.muted{color:var(--q-muted)}
.q-font,.tab b,.brand-name .bn{font-family:"Bahnschrift","Segoe UI",sans-serif}

/* ---------- barra superior ---------- */
.topbar{background:linear-gradient(90deg,#040A18,#071430 60%,#0A1C42) !important;border-bottom:1px solid rgba(34,211,238,.35) !important;min-height:62px;box-shadow:0 1px 0 rgba(0,229,255,.15),0 8px 24px rgba(0,0,0,.35)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#00E5FF 30%,#00E5FF 70%,transparent);opacity:.7}
.brand-name{display:flex;align-items:center;gap:10px;letter-spacing:0;line-height:1}
.brand-name img{height:38px;width:auto;mix-blend-mode:screen;filter:drop-shadow(0 0 8px rgba(0,229,255,.35))}
.brand-name .bt{display:flex;flex-direction:column}
.brand-name .bn{font-weight:700;font-size:19px;letter-spacing:.2em;color:#F4F8FF;white-space:nowrap}

.brand-name .bn b{font-weight:700;color:#00E5FF;letter-spacing:.16em;margin-left:6px;font-size:13px;border:1px solid rgba(0,229,255,.5);border-radius:5px;padding:1px 6px;vertical-align:3px}
.brand-name small{margin-top:5px;font-size:9.5px;letter-spacing:.2em;color:#7FD8EC !important;font-weight:600}
.chip{border-left:1px solid rgba(34,211,238,.18)}
.chip .k{color:#7FA9C2}
button.chip:hover{background:rgba(34,211,238,.08)}

.btn-logout:hover{background:rgba(34,211,238,.1)}

/* ---------- módulos (pestañas) ---------- */
.tabs{top:62px !important;background:rgba(6,14,32,.94) !important;backdrop-filter:blur(8px);border-bottom:1px solid var(--q-line) !important;padding:0 10px !important}
.tab{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 15px 8px !important;color:#8EA3C2 !important;border-bottom:2px solid transparent !important}
.tab b{font-size:12.5px;letter-spacing:.16em;font-weight:700}
.tab small{font-size:10.5px;font-weight:500;color:#5F7699;letter-spacing:.02em}
.tab:hover{color:#E6F0FF !important}
.tab.on{color:#00E5FF !important;border-bottom-color:#00E5FF !important;background:linear-gradient(180deg,transparent,rgba(0,229,255,.07))}
.tab.on small{color:#9FDDEB}
.tab.adm b{color:#C9A85C}.tab.adm.on b{color:#00E5FF}

.page-title h1{font-family:"Bahnschrift","Segoe UI",sans-serif;letter-spacing:.06em;color:#F4F8FF}

/* ---------- paneles, KPIs, campos ---------- */
.panel,.kpi,.sh-card,.toolbar,.dash-f,.opt,.mode-btn,.comp-tile{background:linear-gradient(180deg,#0C1A36,#0A152D) !important;border:1px solid var(--q-line) !important;box-shadow:0 10px 30px rgba(0,0,0,.25) !important;color:var(--q-ink)}
.panel h2,.sec-head h2,.jobs-head h2,.dash-tabs h3{color:#8FD9EA !important;font-family:"Bahnschrift","Segoe UI",sans-serif;letter-spacing:.14em}
.sec-head .tot,.kpi .v,.sh-num,.sh-top b{color:#F4F8FF !important}
.kpi::before{background:#22D3EE !important}.kpi.blue::before{background:#1E6BFF !important}.kpi.warn::before{background:#F59E0B !important}.kpi.err::before{background:#EF4444 !important}
.field label{color:#8EA3C2}
.input,select.input{background:#08132A;border:1.5px solid #233B66;color:#E6F0FF}
.input::placeholder{color:#5F7699}
.input:focus{border-color:#22D3EE;box-shadow:0 0 0 3px rgba(34,211,238,.20)}
select.input option{background:#0B1730;color:#E6F0FF}
input[type=date]{color-scheme:dark}
.check input{accent-color:#22D3EE}
.field.invalid .input{border-color:#EF4444 !important;background:rgba(239,68,68,.14) !important}
.field.warnf .input{border-color:#F59E0B;background:rgba(245,158,11,.12)}
.field .msg{color:#FF9B9B}.field .msg.warn{color:#FBBF5A}

/* ---------- botones ---------- */
.btn{background:#0E1D3C;border:1.5px solid #27416F;color:#DCE8FF}
.btn:hover{border-color:#22D3EE;color:#fff;box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.btn.primary,.btn.teal{background:linear-gradient(180deg,#14B8D9,#0E8FB5) !important;border-color:#22D3EE !important;color:#03111F !important;box-shadow:0 0 18px rgba(0,229,255,.25)}
.btn.primary:hover,.btn.teal:hover{box-shadow:0 0 26px rgba(0,229,255,.45)}
.btn.ok,.cap-actions .btn.ok{background:linear-gradient(180deg,#14B8D9,#0E8FB5) !important;border-color:#00E5FF !important;color:#03111F !important;box-shadow:0 0 20px rgba(0,229,255,.35)}
.btn.danger{background:rgba(239,68,68,.08);color:#FF9B9B;border-color:rgba(239,68,68,.45)}
.btn.danger-solid{background:#DC2626;border-color:#DC2626;color:#fff}
.cap-actions .btn{border-color:#27416F;color:#DCE8FF}
.cap-actions{border-top-color:var(--q-line)}

/* ---------- captura: el campo que espera el escáner brilla ---------- */
.mode-btn:hover,.comp-tile:hover{border-color:#22D3EE !important}
.mode-btn.sel,.comp-tile.sel{border-color:#00E5FF !important;background:linear-gradient(180deg,rgba(0,229,255,.16),rgba(14,143,181,.10)) !important;box-shadow:0 0 0 1px #00E5FF,0 0 22px rgba(0,229,255,.25) !important}

.comp-tile b{color:#F4F8FF}
.cap-head{background:linear-gradient(100deg,#071430 0%,#0A1C42 60%,#0D2A5C 100%) !important;border:1px solid rgba(34,211,238,.35);box-shadow:0 0 24px rgba(0,229,255,.12)}
.cap-head .ci{border-left-color:rgba(34,211,238,.2)}
.cap-head .ci .k{color:#7FA9C2}
.cap-head .ci .ico{stroke:#00E5FF}
.live{border-color:#22D3EE;color:#BFF4F9}
.cont-wrap .input.big{background:#061026;border:2px solid #22D3EE !important;color:#F4F8FF;font-size:20px;box-shadow:0 0 18px rgba(0,229,255,.18)}
.cont-wrap .input.big:focus{box-shadow:0 0 0 3px rgba(0,229,255,.35),0 0 28px rgba(0,229,255,.45);animation:qPulse 1.6s ease-in-out infinite}
.cont-wrap .bc{stroke:#00E5FF}
.field:has(#cont) > label,.job-grid .field label{color:#8FD9EA !important}
.cont-hint{color:#8EA3C2}
.job-grid .input{background:#08132A;border-color:#233B66}
.job-grid .input:focus{border-color:#00E5FF;box-shadow:0 0 0 3px rgba(0,229,255,.30),0 0 18px rgba(0,229,255,.35)}
.field.good .input,.job-grid .input:not(:placeholder-shown){border-color:#34D399 !important;background-color:rgba(52,211,153,.10) !important}
.field.invalid .input{background-image:none !important}
.counter{background:rgba(34,211,238,.12) !important;border-color:rgba(34,211,238,.4) !important;color:#5BE7FF !important}
.flash{background:linear-gradient(90deg,#0F766E,#14B8A6);box-shadow:0 0 24px rgba(52,211,153,.35)}
.cl-table td.n{color:#5F7699}
.save-note{color:#8EA3C2}
@keyframes qPulse{50%{box-shadow:0 0 0 4px rgba(0,229,255,.18),0 0 34px rgba(0,229,255,.55)}}
/* destello al escanear (lo activa q-scan-ok / q-scan-err en el body) */
body.q-ok::after,body.q-err::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:70;animation:qFl .45s ease-out forwards}
body.q-ok::after{box-shadow:inset 0 0 0 6px rgba(52,211,153,.9),inset 0 0 80px rgba(52,211,153,.35)}
body.q-err::after{box-shadow:inset 0 0 0 6px rgba(239,68,68,.95),inset 0 0 90px rgba(239,68,68,.4)}
@keyframes qFl{from{opacity:1}to{opacity:0}}

/* ---------- login ---------- */
.login-page{background:radial-gradient(800px 460px at 50% 30%,rgba(0,229,255,.14),transparent 70%),radial-gradient(1000px 600px at 100% 100%,rgba(30,107,255,.22),transparent 60%),#03070F !important}
.lp-glow.g1{background:#00E5FF !important;opacity:.16 !important}.lp-glow.g2{background:#1E6BFF !important;opacity:.28 !important}.lp-glow.g3{background:#22D3EE !important;opacity:.12 !important}

html[data-theme="light"] .topbar::before{background:repeating-linear-gradient(-55deg,transparent 0 16px,rgba(30,136,255,.16) 16px 27px)}
html[data-theme="light"] .topbar::after{background:linear-gradient(90deg,transparent,rgba(30,136,255,.45) 30%,rgba(30,136,255,.45) 70%,transparent) !important}
html[data-theme="light"] .brand-name .bn,html[data-theme="light"] .brand-name .bn i{color:#0B2A5B !important}
html[data-theme="light"] .brand-name .bn b{color:#1E6FE0 !important;border-color:#1E6FE0 !important}
html[data-theme="light"] .brand-name small{color:#0B2A5B !important}
html[data-theme="light"] .chip{border-left-color:#D3E2F4 !important}
html[data-theme="light"] .chip .k{color:#4A6286 !important}html[data-theme="light"] .chip .v{color:#0B2A5B !important}
html[data-theme="light"] .chip.xl{border-color:#C9DAF0 !important;background:#FFFFFF}
html[data-theme="light"] .btn-logout{border-color:#0B2A5B !important;color:#0B2A5B !important;background:#FFFFFF}
html[data-theme="light"] button.chip:hover{background:#EEF5FF}

/* botón de tema (mismo estilo que QORVEX) */
.thm{height:40px;border-radius:10px !important;border:1px solid rgba(255,255,255,.22) !important;background:rgba(255,255,255,.06)}
.thm button{height:40px !important;padding:0 14px !important;font-size:13px !important;color:#E6F0FF !important}
.thm button.on{background:linear-gradient(180deg,#22C3F5,#1497D6) !important;color:#FFFFFF !important}
html[data-theme="light"] .thm{background:#FFFFFF;border-color:#C9DAF0 !important}
html[data-theme="light"] .thm button{color:#0B2A5B !important}
html[data-theme="light"] .thm button.on{background:linear-gradient(180deg,#2C8CFF,#1666E0) !important;color:#FFFFFF !important}

/* pestañas con ícono */
.tabs{top:70px !important;background:rgba(6,16,36,.94) !important;border-bottom:1px solid rgba(86,160,255,.2) !important;overflow-x:auto}
.tab{flex-direction:row !important;align-items:center !important;gap:10px !important;padding:10px 16px 9px !important;border-bottom:3px solid transparent !important;color:#E6F0FF !important}
.tab .ico{width:24px;height:24px}
.tab .tl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.tab .tl b{font:700 13px "Bahnschrift","Segoe UI",sans-serif;letter-spacing:.06em}
.tab .tl small{font-size:10.5px !important;color:#B9CBE6 !important}
.tab.on{border-bottom-color:#1FD1F9 !important;background:linear-gradient(180deg,rgba(31,209,249,.04),rgba(31,209,249,.12)) !important;color:#1FD1F9 !important}
.tab.adm b{color:#F5C46A}.tab.adm.on b{color:#1FD1F9}
html[data-theme="light"] .tabs{background:rgba(255,255,255,.94) !important;border-bottom:1px solid #D3E2F4 !important}
html[data-theme="light"] .tab{color:#0B2A5B !important}
html[data-theme="light"] .tab .tl small{color:#33507E !important}
html[data-theme="light"] .tab.on{background:#FFFFFF !important;border-bottom-color:#1E88FF !important;color:#1E5FD0 !important;box-shadow:0 6px 16px rgba(11,42,91,.08)}
html[data-theme="light"] .tab.adm b{color:#B7791F}html[data-theme="light"] .tab.adm.on b{color:#1E5FD0}

/* encabezado de "Iniciar captura" con foto de almacén */
.m-hero{position:relative;overflow:hidden;border-radius:20px;margin:0 0 16px;padding:24px 28px;min-height:150px;display:flex;align-items:center;
  border:1px solid rgba(86,160,255,.35);background:radial-gradient(500px 220px at 15% 50%,rgba(31,209,249,.16),transparent 70%),linear-gradient(115deg,#061127 0%,#0A1C3E 55%,#0B2148 100%);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.mh-ph{position:absolute;right:0;top:0;bottom:0;width:48%;background-size:cover;background-position:center;-webkit-mask:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 30%,#000 65%);mask:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 30%,#000 65%)}
.mh-l{display:none}
.mh-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;max-width:60%}
.mh-eye{font:700 12px "Bahnschrift","Segoe UI",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#E6F0FF}
.mh-ttl{font:700 32px "Bahnschrift","Segoe UI",sans-serif;color:#FFFFFF}
.mh-tag{font:700 13px "Bahnschrift","Segoe UI",sans-serif;letter-spacing:.32em;color:#1FD1F9}
.mh-sub{font-size:13px;color:#CFE0F7}
html[data-theme="light"] .m-hero{border-color:#D3E2F4;background:radial-gradient(500px 220px at 15% 50%,rgba(30,136,255,.10),transparent 70%),linear-gradient(115deg,#FFFFFF 0%,#F2F7FD 55%,#E8F1FC 100%);box-shadow:0 14px 30px rgba(11,42,91,.10)}
html[data-theme="light"] .mh-d{display:none}html[data-theme="light"] .mh-l{display:block}
html[data-theme="light"] .mh-eye,html[data-theme="light"] .mh-ttl{color:#0B2A5B}
html[data-theme="light"] .mh-tag{color:#1E6FE0}html[data-theme="light"] .mh-sub{color:#33507E}

/* paneles, KPIs y tarjetas */
.panel,.kpi,.sh-card,.toolbar,.dash-f,.opt{border-radius:16px !important;background:rgba(10,24,52,.78) !important;border:1px solid rgba(86,160,255,.22) !important;box-shadow:0 12px 30px rgba(0,0,0,.25) !important}
.panel h2,.sec-head h2,.jobs-head h2{color:#FFFFFF !important;font-size:15px !important}
.kpi::before{background:#1E88FF !important}.kpi.blue::before{background:#22B8F0 !important}
html[data-theme="light"] .panel,html[data-theme="light"] .kpi,html[data-theme="light"] .sh-card,html[data-theme="light"] .toolbar,html[data-theme="light"] .dash-f,html[data-theme="light"] .opt{background:rgba(255,255,255,.9) !important;border-color:#D3E2F4 !important;box-shadow:0 12px 28px rgba(11,42,91,.08) !important}
html[data-theme="light"] .panel h2,html[data-theme="light"] .sec-head h2,html[data-theme="light"] .jobs-head h2{color:#0B2A5B !important}
html[data-theme="light"] .kpi::before{background:#1E88FF !important}

.mode-btn{--mc:var(--m-green);border-radius:16px !important;background:linear-gradient(160deg,rgba(14,30,62,.92),rgba(8,18,40,.95)) !important;border:1.5px solid color-mix(in srgb,var(--mc) 55%,transparent) !important}
.mode-btn[data-m="secuencia"]{--mc:var(--m-orange)}
.mode-btn .mb-icon{background:color-mix(in srgb,var(--mc) 18%,transparent) !important;color:var(--mc) !important;border-radius:12px !important}
.mode-btn .mb-title{color:#FFFFFF}
.mode-btn.sel{border-color:var(--mc) !important;box-shadow:0 0 0 1px var(--mc),0 10px 26px color-mix(in srgb,var(--mc) 30%,transparent) !important;background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 16%,#0E1E3E),#08122A) !important}
.mode-btn.sel .mb-icon{background:var(--mc) !important;color:#FFFFFF !important}
html[data-theme="light"] .mode-btn{background:linear-gradient(160deg,#FFFFFF,#F5F9FE) !important}
html[data-theme="light"] .mode-btn .mb-title{color:#0B2A5B}
html[data-theme="light"] .mode-btn.sel{background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 10%,#FFFFFF),#FFFFFF) !important}
html[data-theme="light"] .mode-btn.sel .mb-desc{color:#33507E !important}

.comp-tile{--mc:var(--m-blue);border-radius:14px !important;border:1.5px solid color-mix(in srgb,var(--mc) 50%,transparent) !important;border-left:5px solid var(--mc) !important;background:linear-gradient(160deg,rgba(14,30,62,.92),rgba(8,18,40,.95)) !important}
.comp-tile.ct-0{--mc:var(--m-blue)}.comp-tile.ct-1{--mc:var(--m-cyan)}.comp-tile.ct-2{--mc:var(--m-orange)}.comp-tile.ct-3{--mc:var(--m-purple)}.comp-tile.ct-4{--mc:var(--m-green)}.comp-tile.ct-5{--mc:var(--m-pink)}
.comp-tile b{color:#FFFFFF !important}
.comp-tile.sel{border-color:var(--mc) !important;box-shadow:0 0 0 1px var(--mc),0 10px 24px color-mix(in srgb,var(--mc) 30%,transparent) !important;background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 18%,#0E1E3E),#08122A) !important}
html[data-theme="light"] .comp-tile{background:linear-gradient(160deg,#FFFFFF,#F5F9FE) !important}
html[data-theme="light"] .comp-tile b{color:#0B2A5B !important}
html[data-theme="light"] .comp-tile.sel{background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 12%,#FFFFFF),#FFFFFF) !important}

/* botones principales: cian como en QORVEX */
.btn.primary,.btn.teal,.btn.ok,.cap-actions .btn.ok{background:linear-gradient(180deg,#2FD2FA,#159BDB) !important;border:1px solid #6BE3FF !important;color:#04182F !important;box-shadow:0 10px 24px rgba(21,155,219,.4),inset 0 1px 0 rgba(255,255,255,.4) !important;border-radius:12px !important}
html[data-theme="light"] .btn.primary,html[data-theme="light"] .btn.teal,html[data-theme="light"] .btn.ok,html[data-theme="light"] .cap-actions .btn.ok{background:linear-gradient(180deg,#2FD2FA,#159BDB) !important;border:1px solid #6BE3FF !important;color:#04182F !important;box-shadow:0 10px 24px rgba(21,155,219,.35) !important}
.cap-head{border-radius:16px !important;background:linear-gradient(110deg,#061127 0%,#0A1C3E 60%,#0D2A5C 100%) !important;border:1px solid rgba(31,209,249,.35) !important}
html[data-theme="light"] .cap-head{background:linear-gradient(110deg,#12296F 0%,#1E5FD0 100%) !important;border-color:#1E5FD0 !important}
.app-foot .ql{color:#1FD1F9 !important}
html[data-theme="light"] .app-foot .ql{color:#1E6FE0 !important}
html[data-theme="light"] .comp-tile{border:1.5px solid color-mix(in srgb,var(--mc) 45%,#FFFFFF) !important;border-left:5px solid var(--mc) !important}
html[data-theme="light"] .comp-tile.sel{border-color:var(--mc) !important;box-shadow:0 0 0 1px var(--mc),0 10px 22px color-mix(in srgb,var(--mc) 22%,transparent) !important}
html[data-theme="light"] .mode-btn{border:1.5px solid color-mix(in srgb,var(--mc) 50%,#FFFFFF) !important}
html[data-theme="light"] .mode-btn.sel{border-color:var(--mc) !important;box-shadow:0 0 0 1px var(--mc),0 10px 22px color-mix(in srgb,var(--mc) 22%,transparent) !important}
html[data-theme="light"] .mode-btn .mb-icon{background:color-mix(in srgb,var(--mc) 16%,#FFFFFF) !important;color:var(--mc) !important}
html[data-theme="light"] .mode-btn.sel .mb-icon{background:var(--mc) !important;color:#FFFFFF !important}
@media (max-width:1300px){.tab .tl small{display:none}.tab{padding:10px 12px 9px !important}.m-hero .mh-ph{width:40%}}

/* SHA-256 (sin dependencias, funciona también abierto como archivo local) */
function sha256(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const mp = Math.pow, maxWord = mp(2, 32);
  let i, j, result = '';
  const words = [], bitLen = ascii.length * 8;
  let hash = sha256.h = sha256.h || [];
  const k = sha256.k = sha256.k || [];
  let pc = k.length;
  const comp = {};
  for (let cand = 2; pc < 64; cand++) {
    if (!comp[cand]) {
      for (i = 0; i < 313; i += cand) comp[i] = cand;
      hash[pc] = (mp(cand, .5) * maxWord) | 0;
      k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return ''; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((bitLen / maxWord) | 0);
  words[words.length] = bitLen;
  for (j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += (b < 16 ? '0' : '') + b.toString(16); }
  return result;
}

/* ---------------- Turnos ---------------- */
const hm = (t) => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const inShift = (x, m) => { const a = hm(x.s), b = hm(x.e); return a === b ? true : a < b ? (m >= a && m < b) : (m >= a || m < b); };
function shiftObj(ts) { const d = new Date(ts), m = d.getHours() * 60 + d.getMinutes(); return (S.cfg.shifts || []).find((x) => inShift(x, m)) || null; }
function shiftOf(ts) { const x = shiftObj(ts); return x ? x.n : 'Sin turno'; }
const recShift = (r) => r.shift || shiftOf(r.ts);
const isoDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
/* Fecha operativa: si el turno cruza la medianoche, lo capturado después de las 00:00 cuenta para el día en que inició el turno */
function opDate(ts) {
  const d = new Date(ts), m = d.getHours() * 60 + d.getMinutes(), x = shiftObj(ts);
  if (x && hm(x.s) > hm(x.e) && m < hm(x.e)) d.setDate(d.getDate() - 1);
  return isoDay(d);
}

let AC = null;
function beep(kind) {
  try {
    if (kind === 'ok' || kind === 'save' || kind === 'err') { document.body.classList.remove('q-ok', 'q-err'); void document.body.offsetWidth; document.body.classList.add(kind === 'err' ? 'q-err' : 'q-ok'); clearTimeout(beep._t); beep._t = setTimeout(() => document.body.classList.remove('q-ok', 'q-err'), 500); }
    if (S.prefs && S.prefs.sound === false) { if (kind === 'err' && navigator.vibrate) navigator.vibrate([150, 80, 150]); return; }
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = kind === 'err' ? 'square' : 'sine';
    o.frequency.value = kind === 'err' ? 220 : (kind === 'save' ? 1046 : 880);
    g.gain.value = kind === 'err' ? 0.12 : 0.07;
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (kind === 'err' ? 0.4 : 0.1));
    if (kind === 'err' && navigator.vibrate) navigator.vibrate([150, 80, 150]);
  } catch (e) { /* sin audio */ }
}
function modal({ title, body, buttons = [], wide = false, cls = '', onOpen }) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''} ${cls}" role="dialog" aria-modal="true">
    <header><h3>${title}</h3><button class="x" aria-label="Cerrar">&times;</button></header>
    <div class="body">${body}</div><footer></footer></div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('.x', bg).onclick = close;
  const foot = $('footer', bg);
  if (!buttons.length) foot.remove();
  buttons.forEach((b) => {
    const el = document.createElement('button'); el.type = 'button'; el.className = `btn ${b.cls || ''}`; el.innerHTML = b.t;
    el.onclick = async () => { if (b.fn) { const r = await b.fn(bg, close); if (r === false) return; } close(); };
    foot.append(el);
  });
  document.body.append(bg);
  if (onOpen) onOpen(bg, close);
  return { el: bg, close };
}

   - Job único por componente; en Switch Gde máximo 4 veces.
   - Cluster: 1 contenedor = 1 job → el contenedor también es único.
   - Solo cuentan los registros activos (lo limpiado no bloquea).
   ===================================================================== */
const active = () => S.recs.filter((r) => !r.del);
function checkJob(comp, job, inFormCount, excludeIds = []) {
  if (!job) return '';
  const base = S.recs.filter((r) => !r.del && r.comp === comp && r.job === job && !excludeIds.includes(r.id));
  const max = maxRep(comp);
  if (base.length + inFormCount > max) {
    if (max === 1) return base.length ? `Job ya capturado (cont. ${base[0].cont} · ${fDT(base[0].ts)})` : 'Job repetido en esta captura';
    return `Máximo ${max} veces: ya hay ${base.length} en la base${inFormCount > 1 ? ` y ${inFormCount} aquí` : ''}`;
  }
  return '';
}
function checkClusterCont(cont, inFormCount, excludeIds = [], comp = 'Cluster') {
  if (!cont) return '';
  const sw = isSw(comp), base = S.recs.filter((r) => !r.del && r.comp === comp && r.cont === cont && !excludeIds.includes(r.id) && (!sw || (r.type || 'validacion') !== 'secuencia'));
  if (base.length + inFormCount > 1) return base.length ? `${sw ? 'Caja' : 'Contenedor'} ya capturad${sw ? 'a' : 'o'} (${sw ? 'ID' : 'job'} ${base[0].job} · ${fDT(base[0].ts)})` : `${sw ? 'Caja repetida' : 'Contenedor repetido'} en esta captura`;
  return '';
}

/* Lectura de escáner: Enter / Tab del escáner, o ráfaga rápida de teclas sin sufijo */
function wireScan(inp, onCommit) {
  let first = 0, last = 0, count = 0, timer = null;
  const commit = () => { clearTimeout(timer); count = 0; inp.value = norm(inp.value); onCommit(inp); };
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) { e.preventDefault(); commit(); }
  });
  inp.addEventListener('input', (e) => {
    const now = performance.now();
    if (e.inputType && e.inputType !== 'insertText') { count = 0; return; }
    if (!count || now - last > 80) { first = now; count = 1; } else count++;
    last = now; clearTimeout(timer);
    // Escáner sin Enter: ≥4 caracteres a <35 ms entre cada uno y luego 180 ms de silencio
    timer = setTimeout(() => { if (count >= 4 && (last - first) / (count - 1) < 35) commit(); }, 180);
  });
}

function renderJobs() {
  const d = CAP.draft && !CAP.draft.pairs ? CAP.draft : { cont: '', jobs: Array(JOB_STEP).fill('') };
  const m = $('#main');
  m.innerHTML = `${capHeader()}
    <div class="panel">

        <button class="btn" id="add5">${ICON.plus} Agregar 5 jobs</button>

        <button class="btn danger-solid fin">${ICON.flag} Finalizar captura</button>
        <span class="spacer"></span>
        <button class="btn ok xl" id="submit">${ICON.check} SUBMIT</button>
        <div class="save-note">Al guardar, el formulario quedará listo para el siguiente contenedor.</div>
      </div>
    </div>`;
  const cont = $('#cont'), grid = $('#jobs');
  const jobInputs = () => $$('input.job', grid);
  const draftSave = () => { CAP.draft = { cont: norm(cont.value), jobs: jobInputs().map((i) => norm(i.value)) }; capSave(); updCount(); };
  const updCount = () => { const n = jobInputs().filter((i) => i.value.trim()).length; $('#cnt').textContent = `${n} / ${jobInputs().length} · máx ${JOB_MAX}`; $('#add5').disabled = false; };
  const addRows = (vals) => {
    const start = jobInputs().length;
    vals.forEach((v, k) => {
      const i = start + k;
      const f = document.createElement('div'); f.className = 'field';
      f.innerHTML = `<label>Job ${i + 1}</label><input class="input scan job" placeholder="Escanear job" data-max="6" data-i="${i}" value="${esc(v)}" ${scanAttrs()}><div class="msg"></div>`;
      grid.append(f);
      const inp = $('input', f);
      wireScan(inp, onJobCommit);
      inp.addEventListener('input', () => { setMsg(inp, ''); draftSave(); });
      inp.addEventListener('blur', () => { inp.value = norm(inp.value); validateJob(inp, false); });
    });
    updCount();
  };
  const validateJob = (inp, sound = true) => {
    const all = jobInputs(), idx = all.indexOf(inp), v = inp.value;
    if (!v) { setMsg(inp, ''); return true; }
    const inForm = all.slice(0, idx + 1).filter((x) => norm(x.value) === v).length;
    const msg = checkJob(CAP.comp, v, inForm);
    setMsg(inp, msg);
    if (msg && sound) beep('err');
    return !msg;
  };
  const validateCont = () => {
    const v = norm(cont.value); cont.value = v;
    if (!v) { setMsg(cont, 'Escanea el contenedor'); return false; }
    const prev = S.recs.filter((r) => !r.del && r.comp === CAP.comp && r.cont === v);
    setMsg(cont, prev.length ? `Aviso: este contenedor ya tiene ${prev.length} job(s) registrados (${fDT(prev[0].ts)})` : '', 'warn');
    return true;
  };
  function onJobCommit(inp) {
    draftSave();
    if (!inp.value) { $('#submit').focus(); return; }          // Enter en vacío = terminar
    if (!validateJob(inp)) { inp.select(); return; }
    beep('ok');
    const all = jobInputs(), idx = all.indexOf(inp);
    if (idx + 1 < all.length) { all[idx + 1].focus(); return; }
    if (all.length < JOB_MAX) { addRows(Array(JOB_STEP).fill('')); jobInputs()[idx + 1].focus(); draftSave(); return; }
    toast(`Llegaste al máximo de ${JOB_MAX} jobs. Presiona SUBMIT.`, 'warn'); $('#submit').focus();
  }
  wireScan(cont, () => { draftSave(); if (!validateCont()) { beep('err'); return; } beep('ok'); jobInputs()[0].focus(); });
  cont.addEventListener('input', () => { 
    setMsg(cont, '');
    if(cont.value.length > 10) { 
      setMsg(cont, 'Máximo 10 caracteres', 'warn'); 
    }
  });

  addRows(d.jobs.length ? d.jobs : Array(JOB_STEP).fill(''));
  jobInputs().forEach((i) => i.value && validateJob(i, false));
  if (d.cont) validateCont();

  $('#add5').onclick = () => { if (jobInputs().length >= JOB_MAX) return; const n = jobInputs().length; addRows(Array(JOB_STEP).fill('')); jobInputs()[n].focus(); draftSave(); };
  $('#clr').onclick = async () => {
    if (pendingCount() && !(await confirmBox('Limpiar formulario', 'Se borrarán las lecturas que no has enviado.', 'Limpiar'))) return;
    CAP.draft = null; capSave(); renderJobs();
  };
  $('#submit').onclick = () => {
    if (!validateCont()) { beep('err'); cont.focus(); return; }
    const all = jobInputs(); all.forEach((i) => { i.value = norm(i.value); });
    const filled = all.filter((i) => i.value);
    if (!filled.length) { beep('err'); toast('Captura al menos un job', 'err'); all[0].focus(); return; }
    const bad = filled.find((i) => !validateJob(i, false));
    if (bad) { beep('err'); toast('Corrige los jobs marcados en rojo', 'err'); bad.focus(); bad.select(); return; }
    const c = norm(cont.value), now = Date.now(), lote = S.seq.b + 1;
    const nuevos = filled.map((i) => ({ id: S.seq.r + 1 + filled.indexOf(i), ts: now, emp: ME.emp, name: ME.name, comp: CAP.comp, plates: CAP.plates, cont: c, job: i.value, lote, ses: CAP.sid, type: 'validacion', shift: shiftOf(now), ed: 0, del: null }));
    S.recs.push(...nuevos); S.seq.r += nuevos.length; S.seq.b = lote;
    if (!save('recs', 'seq')) return;
    beep('save');
    CAP.draft = null; capSave();
    renderJobs();
    showFlash(`Contenedor <b>${esc(c)}</b>: ${nuevos.length} job(s) guardados · Job ${lote}`);
    $('#cont').focus();
  };
  $$('.fin', m).forEach((b) => (b.onclick = finalizeModal));
  updCount();
  (d.cont ? (jobInputs().find((i) => !i.value) || cont) : cont).focus();
}

function finalizeModal() {
  const st = sessionStats(), pend = pendingCount();
  const clusterRows = st.rows.filter(r => r.comp === 'Cluster');
  const hasData = clusterRows.length > 0;
  let page = 0;
  const perPage = 6;

  const buildTable = (p) => {
    const start = p * perPage;
    const end = start + perPage;
    const rows = clusterRows.slice(start, end);
    const html = `<table class="t" style="margin-bottom:16px;width:100%"><thead><tr><th>#</th><th>Contenedor</th><th>Job</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr><td class="n">${start + i + 1}</td><td>${esc(r.cont)}</td><td>${esc(r.job)}</td></tr>`).join('')}
    </tbody></table>`;
    const pageInfo = `<div class="muted" style="text-align:center;font-size:12px;margin-bottom:12px">${start + rows.length} de ${clusterRows.length} registros</div>`;
    const nav = clusterRows.length > perPage ? `<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
      <button class="btn sm" data-action="prev" ${p === 0 ? 'disabled' : ''}>← Anterior</button>
      <button class="btn sm" data-action="next" ${end >= clusterRows.length ? 'disabled' : ''}>Siguiente →</button>
    </div>` : '';
    return html + pageInfo + nav;
  };

  const modal_el = modal({ title: 'Finalizar captura', wide: true, body: `
    ${pend ? `<div class="banner warn">Hay <b>${pend}</b> lectura(s) sin enviar. Si continúas sin presionar SUBMIT se perderán.</div>` : ''}
    ${!hasData ? `<div class="muted" style="padding:20px;text-align:center">No hay registros capturados para Cluster.</div>` : ''}
    <div id="cluster-table">${hasData ? buildTable(0) : ''}</div>
    <div class="grid g2">
      <div class="kpi"><div class="k">Contenedores</div><div class="v">${st.conts}</div><div class="s">${esc(CAP.comp)} · Placas ${esc(CAP.plates)}</div></div>
      <div class="kpi blue"><div class="k">Jobs guardados</div><div class="v">${st.jobs}</div><div class="s">en esta unidad</div></div>
    </div>
    <div class="muted">¿Qué quieres hacer?</div>
    <div class="opt-list">
      <button class="opt" data-a="more"><b>Capturar otra unidad</b><span class="n">Mismo componente, nuevas placas</span></button>
      <button class="opt" data-a="comp"><b>Cambiar de componente</b><span class="n">Elegir componente y placas</span></button>
      ${st.jobs ? '<button class="opt" data-a="xls"><b>Descargar Excel de esta unidad</b><span class="n">Va a Descargas</span></button>' : ''}
      <button class="opt" data-a="out"><b>Salir</b><span class="n">Cerrar sesión</span></button>
    </div>`,
    buttons: [{ t: 'Atrás', cls: 'primary' }],
    onOpen: (el, close) => {
      $$('[data-action]', el).forEach((b) => (b.onclick = () => {
        const action = b.dataset.action;
        if (action === 'prev') page--;
        else if (action === 'next') page++;
        $('#cluster-table').innerHTML = buildTable(page);
        $$('[data-action]', el).forEach((btn) => {
          btn.disabled = (page === 0 && btn.dataset.action === 'prev') ||
                        (page * perPage + perPage >= clusterRows.length && btn.dataset.action === 'next');
        });
      }));
      $$('.opt', el).forEach((b) => (b.onclick = () => {
        const a = b.dataset.a;
        if (a === 'xls') { exportRecords(st.rows, `${CAP.comp}_${CAP.plates}`, false); return; }
        close();
        if (a === 'more') { CAP = { comp: CAP.comp }; capSave(); renderCaptura(); }
        else if (a === 'comp') { CAP = null; capSave(); renderCaptura(); }
        else if (a === 'out') logout();
      }));
    },
  });
}

/* =====================================================================
   REGISTROS: "Mis capturas" (usuario) y "Respaldo" (admin, incluye limpiados)
   ===================================================================== */
const F0 = () => ({ q: '', comp: '', from: '', to: '', range: false, shift: '', user: '', page: 0 });
const FILT = { mine: F0(), validacion: F0(), secuencia: F0(), all: { q: '', comp: '', from: '', to: '', range: false, shift: '', user: '', est: 'all', page: 0 } };
/* Todos los usuarios ven todos los registros activos; solo quien capturó puede editar */
function baseRows(mode) { return mode === 'mine' ? S.recs.filter((r) => !r.del) : S.recs; }
function applyFilters(rows, F, mode, skipComp = false) {
  if (mode === 'all') {
    if (F.est === 'act') rows = rows.filter((r) => !r.del);
    else if (F.est === 'del') rows = rows.filter((r) => r.del);
  }
  if (F.user) rows = rows.filter((r) => r.emp === F.user);
  if (F.shift) rows = rows.filter((r) => recShift(r) === F.shift);
  if (F.comp && !skipComp) rows = rows.filter((r) => r.comp === F.comp);
  if (F.q) { const q = norm(F.q); rows = rows.filter((r) => [r.job, r.cont, r.plates, r.emp, r.name, r.comp].some((v) => norm(v).includes(q)) || String(r.lote) === q); }
  // Fecha sola = ese día; con "Hasta" = rango
  if (F.from) { const t = new Date(`${F.from}T00:00:00`).getTime(); rows = rows.filter((r) => r.ts >= t); }
  const until = F.range ? F.to : F.from;
  if (until) { const t = new Date(`${until}T00:00:00`).getTime() + 86400000; rows = rows.filter((r) => r.ts < t); }
  return rows;
}
const canEdit = (r) => !!r && !r.del && !!ME && (r.emp === ME.emp || isAdmin());
function renderRecords(mode, typeFilter = null) {
  const F = FILT[(mode === 'mine' && typeFilter) || mode], m = $('#main'), adm = mode === 'all';
  const isSeq = typeFilter === 'secuencia';
  const today = opDate(Date.now()), onlyToday = !adm && !isAdmin();
  const pool = ofType(baseRows(mode), typeFilter).filter((r) => !onlyToday || (r.emp === ME.emp && opDate(r.ts) === today));
  const users = uniq(pool.map((r) => r.emp)).map((e) => ({ emp: e, name: (S.users.find((u) => u.emp === e) || pool.find((r) => r.emp === e)).name }));
  const shifts = uniq([...S.cfg.shifts.map((x) => x.n), ...pool.map(recShift)]);
  const typeLabel = typeFilter === 'validacion' ? 'Validación' : isSeq ? 'Secuenciado' : null;
  m.innerHTML = `

      ${F.range ? `<div class="field"><label>Hasta</label><input class="input" type="date" id="fh" value="${F.to}" title="Hasta"></div>` : ''}
      <div class="field"><label>Turno</label><select class="input" id="fs" title="Turno"><option value="">Turno</option>${shifts.map((x) => `<option ${F.shift === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label>Usuario</label><select class="input" id="fu" title="Usuario"><option value="">Usuario</option>${users.map((u) => `<option value="${esc(u.emp)}" ${F.user === u.emp ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>
      ${adm ? `<div class="field"><label>Estado</label><select class="input" id="fe">
        <option value="all" ${F.est === 'all' ? 'selected' : ''}>Todos</option><option value="act" ${F.est === 'act' ? 'selected' : ''}>Activos</option><option value="del" ${F.est === 'del' ? 'selected' : ''}>Limpiados</option></select></div>` : ''}
      <button class="btn sm" id="reset">Quitar filtros</button>
    </div>
    </div>
    <div class="table-wrap" id="tw"></div>
    <div class="pager" id="pg"></div>`;
  const pin = () => {
    const tabs = $('#tabs'), fb = $('#fbar'); if (!tabs || !fb) return;
    const top = tabs.getBoundingClientRect().height + ($('.topbar')?.getBoundingClientRect().height || 0);
    fb.style.top = top + 'px';
    document.documentElement.style.setProperty('--thTop', (top + fb.getBoundingClientRect().height) + 'px');
  };
  window.onresize = pin; setTimeout(pin, 0);
  const draw = () => {
    const pre = applyFilters(pool, F, mode, true);
    $('#chips').innerHTML = [['', 'Todos', pre.length], ...COMPS.map((c) => [c, c, pre.filter((r) => r.comp === c).length])]
      .map(([v, t, n]) => `<button class="cchip ${F.comp === v ? 'on' : ''}" data-c="${esc(v)}">${esc(t)}<b>${fmtN(n)}</b></button>`).join('');
    $$('#chips .cchip').forEach((b) => (b.onclick = () => { F.comp = b.dataset.c; F.page = 0; draw(); }));
    const rows = applyFilters(pool, F, mode).slice().sort((a, b) => b.ts - a.ts || b.id - a.id);
    const delN = rows.filter((r) => r.del).length;
    $('#kpis').innerHTML = `
      <div class="kpi"><div class="k">Registros (jobs)</div><div class="v">${fmtN(rows.length)}</div><div class="s">${adm ? `${fmtN(delN)} limpiados` : 'con los filtros actuales'}</div></div>
      <div class="kpi blue"><div class="k">Contenedores</div><div class="v">${fmtN(uniq(rows.map((r) => `${r.comp}|${r.cont}`)).length)}</div></div>
      ${isSeq ? `<div class="kpi"><div class="k">Usuarios</div><div class="v">${fmtN(uniq(rows.map((r) => r.emp)).length)}</div></div>`
        : `<div class="kpi"><div class="k">Unidades (placas)</div><div class="v">${fmtN(uniq(rows.map((r) => r.plates)).length)}</div></div>`}
      <div class="kpi warn"><div class="k">Filas editadas</div><div class="v">${fmtN(rows.filter((r) => r.ed).length)}</div></div>`;
    const pages = Math.max(1, Math.ceil(rows.length / PAGE)); F.page = Math.min(F.page, pages - 1);
    const view = rows.slice(F.page * PAGE, (F.page + 1) * PAGE);
    $('#tw').innerHTML = rows.length ? `<table class="t"><thead><tr>
        <th>Fecha</th><th>Hora</th><th>Job</th><th>Contenedor</th><th>Componente</th>${isSeq ? '' : '<th>Placas</th>'}<th>Lote</th><th>Usuario</th><th>Turno</th>${adm ? '<th>Estado</th>' : ''}<th></th></tr></thead><tbody>
      ${view.map((r) => `<tr class="${r.del ? 'deleted' : ''}">
        <td>${fDate(r.ts)}</td><td>${fTime(r.ts)}</td>
        <td class="mono">${esc(r.job)}</td><td class="mono">${esc(r.cont)}</td>
        <td><span class="badge b-info">${esc(r.comp)}</span></td>
        ${isSeq ? '' : `<td class="mono">${esc(r.plates || '—')}</td>`}
        <td>${r.lote}</td>
        <td class="usr">${esc(r.name || r.emp)}${r.emp === ME.emp ? ' <span class="badge b-ok">Tú</span>' : ''}</td>
        <td><span class="shf">${esc(recShift(r))}</span></td>
        ${adm ? `<td>${r.del ? `<span class="badge b-mute" title="Limpiado por ${esc(r.del.emp)} el ${fDT(r.del.ts)}">Limpiado</span>` : '<span class="badge b-ok">Activo</span>'}</td>` : ''}
        <td style="white-space:nowrap">${r.ed ? `<span class="badge b-warn" title="Editado ${r.ed} vez/veces">Editado</span> ` : ''}${canEdit(r) ? `<button class="btn sm" data-ed="${r.id}">${ICON.edit} Editar</button> <button class="btn sm danger" data-dl="${r.id}" title="Eliminar esta fila">${ICON.trash}</button>` : ''}</td>
      </tr>`).join('')}</tbody></table>` : `<div class="empty">${pool.length ? 'Ningún registro coincide con los filtros.' : onlyToday ? 'Aún no tienes capturas hoy.' : 'Aún no hay capturas.'}</div>`;
    $$('[data-ed]', m).forEach((b) => (b.onclick = () => editRecord(S.recs.find((r) => r.id === Number(b.dataset.ed)), draw)));
    $$('[data-dl]', m).forEach((b) => (b.onclick = () => deleteRow(S.recs.find((r) => r.id === Number(b.dataset.dl)), draw)));
    $('#pg').innerHTML = pages > 1 ? `<button class="btn sm" id="pv" ${F.page ? '' : 'disabled'}>‹ Anterior</button><span class="muted">Página ${F.page + 1} de ${pages} · ${fmtN(rows.length)} registros</span><button class="btn sm" id="nx" ${F.page < pages - 1 ? '' : 'disabled'}>Siguiente ›</button>` : '';
    if (pages > 1) { $('#pv').onclick = () => { F.page--; draw(); }; $('#nx').onclick = () => { F.page++; draw(); }; }
  };
  let qt = null;
  $('#q').oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value; F.page = 0; draw(); }, 200); };
  $('#fd').onchange = (e) => { F.from = e.target.value; F.page = 0; draw(); };
  if (F.range) $('#fh').onchange = (e) => { F.to = e.target.value; F.page = 0; draw(); };
  $('#frg').onclick = () => { F.range = !F.range; if (!F.range) F.to = ''; F.page = 0; renderRecords(mode, typeFilter); };
  $('#fs').onchange = (e) => { F.shift = e.target.value; F.page = 0; draw(); };
  $('#fu').onchange = (e) => { F.user = e.target.value; F.page = 0; draw(); };
  if (adm) $('#fe').onchange = (e) => { F.est = e.target.value; F.page = 0; draw(); };
  $('#reset').onclick = () => { Object.assign(F, { q: '', comp: '', from: '', to: '', range: false, shift: '', user: '', page: 0 }, adm ? { est: 'all' } : {}); renderRecords(mode, typeFilter); };
  $('#exp').onclick = () => exportModal(mode, typeFilter);
  if (!adm) $('#wipe').onclick = () => wipeModal(typeFilter);
  draw();
}

const ofType = (rows, t) => (t ? rows.filter((r) => (r.type || 'validacion') === t) : rows);
const typeName = (t) => (t === 'secuencia' ? 'Secuencia' : t === 'validacion' ? 'Validación' : '');
function exportModal(mode, typeFilter = null) {
  const F = FILT[(mode === 'mine' && typeFilter) || mode], adm = mode === 'all';
  const base = ofType(baseRows(mode), typeFilter), filtered = applyFilters(base, F, mode);
  const opts = [
    ['f', 'Lo que estoy viendo (filtros actuales)', filtered.length],
    ['all', adm ? 'Todo el respaldo' : `Todo ${typeName(typeFilter) || ''} (todos los usuarios)`, base.length],
    ...COMPS.map((c) => [`c:${c}`, `Solo ${c}`, base.filter((r) => r.comp === c).length]),
  ];
  modal({ title: `Exportar a Excel${typeFilter ? ' · ' + typeName(typeFilter) : ''}`, body: `
    <div class="muted">El archivo se guarda en la carpeta <b>Descargas</b> de la tableta. Incluye una hoja <b>Resumen</b> y una hoja por componente.</div>
    <div class="opt-list">${opts.map(([k, t, n]) => `<button class="opt" data-k="${esc(k)}" ${n ? '' : 'disabled style="opacity:.45;cursor:not-allowed"'}><b>${esc(t)}</b><span class="n">${fmtN(n)} registros</span></button>`).join('')}</div>`,
    buttons: [{ t: 'Cerrar' }],
    onOpen: (el, close) => $$('.opt', el).forEach((b) => (b.onclick = () => {
      const k = b.dataset.k;
      const rows = k === 'f' ? filtered : k === 'all' ? base : base.filter((r) => r.comp === k.slice(2));
      const label = k === 'f' ? (F.comp || 'Filtrado') : k === 'all' ? 'Todo' : k.slice(2);
      exportRecords(rows, `${adm ? 'Respaldo_' : ''}${label}`, adm, typeFilter);
      close();
    })),
  });
}

function editRecord(r, after) {
  if (!r || r.del) return;
  if (!canEdit(r)) return toast('Solo quien capturó este registro puede editarlo', 'err');
  const loteRows = S.recs.filter((x) => !x.del && x.lote === r.lote);
  const swV = isSw(r.comp) && (r.type || 'validacion') !== 'secuencia', pairC = r.comp === 'Cluster' || swV;
  const canJob = !pairC && loteRows.length > 1;
  modal({ title: `Editar registro #${r.id}`, body: `
    <div class="grid g2" style="font-size:14px">
      <div><span class="muted">Componente</span><br><b>${esc(r.comp)}</b></div>
      <div><span class="muted">Placas</span><br><b>${esc(r.plates)}</b></div>
      <div><span class="muted">Capturado</span><br><b>${fDT(r.ts)}</b></div>
      <div><span class="muted">Usuario</span><br><b>${esc(r.emp)} · ${esc(r.name)}</b></div>
    </div>
    <div class="field"><label>${swV ? 'Caja' : 'Contenedor'}</label><input class="input big scan" id="eC" value="${esc(r.cont)}" ${scanAttrs()}><div class="msg"></div></div>
    ${canJob ? `<label class="check"><input type="checkbox" id="eL"> Aplicar el cambio de contenedor a los ${loteRows.length} jobs de este contenedor (lote ${r.lote})</label>` : ''}
    <div class="field"><label>${swV ? 'ID' : 'Job'}</label><input class="input big scan job" id="eJ" data-max="${swV ? SW_ID_MAX : JOB_DIGITS}" value="${esc(r.job)}" ${scanAttrs()}><div class="msg"></div></div>
    <div class="muted" style="font-size:13px">Cada cambio queda registrado en <b>Cambios</b> con el valor anterior y el nuevo.</div>`,
    onOpen: (el) => { const i = $('#eJ', el); i.focus(); i.select(); $('#eC', el).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); i.focus(); i.select(); } }); },
    buttons: [{ t: 'Cancelar' }, { t: 'Guardar cambios', cls: 'primary', fn: (el) => {
      const ci = $('#eC', el), ji = $('#eJ', el), lote = canJob && $('#eL', el).checked;
      const nc = norm(ci.value), nj = onlyNum(ji.value, swV ? SW_ID_MAX : JOB_DIGITS); ci.value = nc; ji.value = nj;
      setMsg(ci, ''); setMsg(ji, '');
      if (!nc) { setMsg(ci, 'Requerido'); return false; }
      if (!nj) { setMsg(ji, 'Requerido'); return false; }
      if (nc === r.cont && nj === r.job) { toast('Sin cambios', 'info'); return; }
      if (nj !== r.job) { const msg = checkJob(r.comp, nj, 1, [r.id]); if (msg) { setMsg(ji, msg); beep('err'); return false; } }
      if (pairC && nc !== r.cont) { const msg = checkClusterCont(nc, 1, [r.id], r.comp); if (msg) { setMsg(ci, msg); beep('err'); return false; } }
      const now = Date.now();
      const log = (rec, field, before, afterV) => { S.seq.c += 1; S.chg.push({ id: S.seq.c, ts: now, emp: ME.emp, name: ME.name, rid: rec.id, comp: rec.comp, plates: rec.plates, lote: rec.lote, owner: rec.emp, field, before, after: afterV }); };
      const touched = new Set();
      if (nc !== r.cont) (lote ? loteRows : [r]).forEach((t) => { if (t.cont !== nc) { log(t, 'Contenedor', t.cont, nc); t.cont = nc; touched.add(t); } });
      if (nj !== r.job) { log(r, 'Job', r.job, nj); r.job = nj; touched.add(r); }
      touched.forEach((t) => { t.ed = (t.ed || 0) + 1; });
      if (!save('recs', 'chg', 'seq')) return false;
      toast('Cambio guardado y registrado', 'ok');
      if (after) after();
    } }],
  });
}

function wipeModal(typeFilter = null) {
  const today = opDate(Date.now());
  const mine = ofType(S.recs.filter((r) => r.emp === ME.emp && !r.del && opDate(r.ts) === today), typeFilter);
  if (!mine.length) return toast('No tienes capturas de hoy para limpiar', 'info');
  modal({ title: 'Limpiar mis capturas de hoy', cls: 'danger', body: `
    <div class="banner err">Se eliminarán del Excel <b>solo tus capturas de hoy</b> (${fDate(Date.now())}). Las de fechas anteriores no se tocan; esas se corrigen fila por fila.</div>
    <div class="field"><label>¿Qué quieres limpiar?</label><select class="input" id="wS">
      <option value="">Todas mis capturas de hoy (${fmtN(mine.length)})</option>
      ${COMPS.map((c) => { const n = mine.filter((r) => r.comp === c).length; return n ? `<option value="${esc(c)}">Solo ${esc(c)} (${fmtN(n)})</option>` : ''; }).join('')}
    </select></div>
    <label class="check"><input type="checkbox" id="wX" checked> Descargar Excel de esas capturas antes de limpiar</label>
    <div class="field"><label>Escribe LIMPIAR para confirmar</label><input class="input" id="wC" autocomplete="off"><div class="msg"></div></div>`,
    buttons: [{ t: 'Cancelar' }, { t: 'Limpiar', cls: 'danger-solid', fn: (el) => {
      const cc = $('#wC', el); if (norm(cc.value) !== 'LIMPIAR') { setMsg(cc, 'Escribe LIMPIAR'); return false; }
      const c = $('#wS', el).value, rows = mine.filter((r) => !c || r.comp === c);
      if ($('#wX', el).checked) exportRecords(rows, `Antes_de_limpiar_${c || 'Todo'}`, false, typeFilter);
      const now = Date.now();
      rows.forEach((r) => { r.del = { ts: now, emp: ME.emp }; S.seq.c += 1; S.chg.push({ id: S.seq.c, ts: now, emp: ME.emp, name: ME.name, rid: r.id, comp: r.comp, plates: r.plates, lote: r.lote, owner: r.emp, field: 'Fila', before: `${r.job} · ${r.cont}`, after: 'Eliminada (limpieza del día)' }); });
      if (!save('recs', 'chg', 'seq')) return false;
      toast(`${fmtN(rows.length)} registro(s) limpiados`, 'ok'); showTab(TAB);
    } }],
  });
}
/* Eliminar UNA fila (cualquier fecha): quien la capturó o un administrador */
function deleteRow(r, after) {
  if (!canEdit(r)) return toast('Solo quien capturó o un administrador puede eliminar esta fila', 'err');
  modal({ title: `Eliminar fila #${r.id}`, cls: 'danger', body: `
    <div class="banner err">Se eliminará <b>solo esta fila</b> del Excel de ${typeName(r.type || 'validacion')}. Se guarda un respaldo antes.</div>
    <div class="grid g2" style="font-size:14px">
      <div><span class="muted">Fecha</span><br><b>${fDT(r.ts)}</b></div>
      <div><span class="muted">Componente</span><br><b>${esc(r.comp)}</b></div>
      <div><span class="muted">Job</span><br><b>${esc(r.job)}</b></div>
      <div><span class="muted">Contenedor</span><br><b>${esc(r.cont)}</b></div>
      <div><span class="muted">Capturó</span><br><b>${esc(r.emp)} · ${esc(r.name)}</b></div>
      <div><span class="muted">Lote</span><br><b>${esc(r.lote)}</b></div>
    </div>`,
    buttons: [{ t: 'Cancelar' }, { t: 'Eliminar fila', cls: 'danger-solid', fn: () => {
      const now = Date.now(); r.del = { ts: now, emp: ME.emp };
      S.seq.c += 1; S.chg.push({ id: S.seq.c, ts: now, emp: ME.emp, name: ME.name, rid: r.id, comp: r.comp, plates: r.plates, lote: r.lote, owner: r.emp, field: 'Fila', before: `${r.job} · ${r.cont}`, after: 'Eliminada' });
      if (!save('recs', 'chg', 'seq')) return false;
      toast('Fila eliminada', 'ok'); if (after) after();
    } }],
  });
}

/* =====================================================================
   CAMBIOS EJECUTADOS
   ===================================================================== */
const CF = { q: '', comp: '', user: '', page: 0 };
function renderChanges() {
  const adm = isAdmin(), m = $('#main');
  const base = () => (adm ? S.chg : S.chg.filter((c) => c.emp === ME.emp || c.owner === ME.emp));
  const users = uniq(S.chg.map((c) => c.emp));
  m.innerHTML = `
    <div class="page-title"><h1>Cambios ejecutados</h1><div class="sub">${adm ? 'Todas las ediciones con valor anterior y nuevo' : 'Ediciones hechas a tus capturas'}</div>
      <div class="actions"><button class="btn primary" id="exp">${ICON.dl} Exportar a Excel</button></div></div>
    <div class="toolbar">
      <div class="field search"><label>Buscar</label><input class="input" id="q" placeholder="Valor anterior o nuevo, placas, # registro" value="${esc(CF.q)}" autocomplete="off"></div>
      <div class="field"><label>Componente</label><select class="input" id="fc"><option value="">Todos</option>${COMPS.map((c) => `<option ${CF.comp === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      ${adm ? `<div class="field"><label>Editado por</label><select class="input" id="fu"><option value="">Todos</option>${users.map((u) => `<option ${CF.user === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="table-wrap" id="tw"></div><div class="pager" id="pg"></div>`;
  const rowsF = () => {
    let rows = base();
    if (CF.comp) rows = rows.filter((c) => c.comp === CF.comp);
    if (adm && CF.user) rows = rows.filter((c) => c.emp === CF.user);
    if (CF.q) { const q = norm(CF.q); rows = rows.filter((c) => c.before.includes(q) || c.after.includes(q) || c.plates.includes(q) || String(c.rid) === q.replace('#', '')); }
    return rows.slice().sort((a, b) => b.ts - a.ts || b.id - a.id);
  };
  const draw = () => {
    const rows = rowsF(), pages = Math.max(1, Math.ceil(rows.length / PAGE)); CF.page = Math.min(CF.page, pages - 1);
    const view = rows.slice(CF.page * PAGE, (CF.page + 1) * PAGE);
    $('#tw').innerHTML = rows.length ? `<table class="t"><thead><tr><th>Fecha y hora</th><th>Editado por</th><th>Registro</th><th>Componente</th><th>Placas</th><th>Campo</th><th>Antes</th><th>Después</th></tr></thead><tbody>
      ${view.map((c) => `<tr><td>${fDT(c.ts)}</td><td>${esc(c.emp)}<div class="muted" style="font-size:12px">${esc(c.name)}</div></td><td>#${c.rid}<div class="muted" style="font-size:12px">Job ${c.lote}</div></td>
        <td><span class="badge b-info">${esc(c.comp)}</span></td><td class="mono">${esc(c.plates)}</td><td><b>${esc(c.field)}</b></td>
        <td class="diff-b">${esc(c.before)}</td><td class="diff-a">${esc(c.after)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">No hay cambios registrados.</div>';
    $('#pg').innerHTML = pages > 1 ? `<button class="btn sm" id="pv" ${CF.page ? '' : 'disabled'}>‹ Anterior</button><span class="muted">Página ${CF.page + 1} de ${pages}</span><button class="btn sm" id="nx" ${CF.page < pages - 1 ? '' : 'disabled'}>Siguiente ›</button>` : '';
    if (pages > 1) { $('#pv').onclick = () => { CF.page--; draw(); }; $('#nx').onclick = () => { CF.page++; draw(); }; }
  };
  let qt = null;
  $('#q').oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { CF.q = e.target.value; CF.page = 0; draw(); }, 200); };
  $('#fc').onchange = (e) => { CF.comp = e.target.value; CF.page = 0; draw(); };
  if (adm) $('#fu').onchange = (e) => { CF.user = e.target.value; CF.page = 0; draw(); };
  $('#exp').onclick = () => { const rows = rowsF(); if (!rows.length) return toast('No hay cambios para exportar', 'warn'); exportWorkbook([['Cambios', changeRows(rows)]], `Cambios_${stamp()}.xlsx`); };
  draw();
}
